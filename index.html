<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生活管理样板</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Serif+SC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="control-panel glass-panel">
        <div class="brand-block">
          <h1>个人管理中枢</h1>
        </div>

        <section class="control-group">
          <div class="section-title">
            <span>页面</span>
            <button class="ghost-button" id="shuffleButton" type="button">随机查看</button>
          </div>
          <nav class="page-nav" id="pageNav"></nav>
        </section>

        <section class="control-group">
          <div class="section-title">
            <span>设备</span>
          </div>
          <div class="device-switch" id="deviceSwitch">
            <button class="mode-button active" data-device="desktop" type="button">桌面端</button>
            <button class="mode-button" data-device="mobile" type="button">手机端</button>
          </div>
          <div class="dimension-card">
            <p class="dimension-label">尺寸</p>
            <strong id="dimensionLabel">1440 x 960</strong>
            <p id="dimensionHint">桌面端采用信息密度更高的分栏布局。</p>
          </div>
        </section>
      </aside>

      <main class="stage-area">
        <div class="stage-meta glass-panel">
          <div>
            <h2 id="stageTitle">任务页面</h2>
          </div>
          <div class="stage-actions">
            <button class="ghost-button" id="previewAction" type="button">下一页</button>
            <div class="toast" id="toast">已切换</div>
          </div>
        </div>

        <div class="stage-wrapper">
          <div class="stage-scaler" id="stageScaler">
            <div class="page-canvas desktop" id="pageCanvas">
              <div class="page-root" id="pageRoot"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <template id="pageTemplate">
      <section class="page-layout">
        <header class="hero glass-card">
          <div>
            <h3 data-field="title"></h3>
          </div>
          <div class="hero-actions">
            <button class="primary-button interactive" type="button" data-field="primaryAction"></button>
            <button class="secondary-button interactive" type="button" data-field="secondaryAction"></button>
          </div>
        </header>

        <section class="priority-grid">
          <div class="priority-main glass-card" data-field="focusMain"></div>
          <aside class="priority-side">
            <div class="priority-actions glass-card" data-field="focusQuick"></div>
            <div class="priority-stats glass-card" data-field="focusProgress"></div>
          </aside>
        </section>

        <section class="metric-grid" data-field="metrics"></section>

        <section class="board-grid">
          <div class="board-main" data-field="mainSections"></div>
          <aside class="board-side" data-field="sideSections"></aside>
        </section>
      </section>
    </template>

    <script src="./script.js"></script>
  </body>
  </html>
