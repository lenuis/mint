<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus OS - 个人中枢</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- 桌面端侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo"></div>
        <h1>Nexus OS</h1>
      </div>
      <nav class="nav-menu" id="desktopNav"></nav>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">E</div>
          <div class="user-info">
            <span class="user-name">Evan.</span>
            <span class="user-status">在线 · 专注中</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Overview</h2>
          <span id="pageSubtitle" class="page-subtitle"></span>
        </div>
        <div class="topbar-right">
          <button class="btn-ghost interactive" id="secondaryActionBtn">Action</button>
          <button class="btn-primary interactive" id="primaryActionBtn">Action</button>
        </div>
      </header>
      
      <div class="scroll-area">
        <div id="pageRoot" class="bento-container">
          <!-- 动态渲染的便当盒内容 -->
        </div>
      </div>
    </main>

    <!-- 手机端底部导航 -->
    <nav class="mobile-nav" id="mobileNav"></nav>
  </div>

  <!-- 提示浮层 -->
  <div id="toast" class="toast-message"></div>

  <!-- 详情侧滑面板 (Side Panel) -->
  <div id="detailOverlay" class="detail-overlay"></div>
  <div id="detailPane" class="detail-pane">
    <div class="detail-pane-header">
      <h3 id="detailPaneTitle">详情</h3>
      <button class="btn-icon" id="detailPaneClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="detail-pane-content" id="detailPaneContent">
      <!-- 动态表单和交互内容将渲染在这里 -->
    </div>
    <div class="detail-pane-footer" id="detailPaneFooter">
      <!-- 动态操作按钮将渲染在这里 -->
    </div>
  </div>

  <!-- 模板区域（仅用于结构参考，具体渲染在 JS 中进行） -->
  <template id="bentoTemplate">
    <div class="bento-grid"></div>
  </template>

  <script src="script.js"></script>
</body>
</html>
